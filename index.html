<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Houseboat Reservation</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0284c7">
  <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #f8fafc; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <!-- Embedded Apps Script Web App -->
  <iframe src="https://script.google.com/macros/s/AKfycbzV6rsuvulWQYUb50lBfL1MqTB9Q58pspPqcYikb4b_Z6csTSp6DZ17uNaTSEqByrJkwQ/exec" title="Houseboat Reservation System"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered:', reg.scope))
          .catch(err => console.error('SW Error:', err));
      });
    }
  </script>
</body>
</html>
